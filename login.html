<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — Stackly Book Store</title>
    <meta name="description" content="Sign in or create your Stackly Book Store account." />
    <link rel="icon" href="favicon.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: #f4efe3;
        color: #1d231f;
        font:
          16px/1.65 Georgia,
          serif;
        overflow-x: hidden;
      }
      body.menu-open {
        overflow: hidden;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a {
        transition: 0.25s ease;
      }
      img {
        max-width: 100%;
        display: block;
      }
      .site-header {
        position: fixed;
        z-index: 50;
        inset: 0 0 auto;
        min-height: 78px;
        padding: 12px clamp(20px, 5vw, 76px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        color: #fff;
        border-bottom: 1px solid #ffffff2b;
        background: #08261dcc;
        backdrop-filter: blur(14px);
        transition: 0.3s;
      }
      .site-header.scrolled {
        background: #08261df5;
        box-shadow: 0 10px 35px #0004;
      }
      .brand img {
        width: 132px;
        height: 44px;
        object-fit: contain;
      }
      .site-header nav {
        display: flex;
        gap: 30px;
      }
      .site-header nav a {
        font:
          600 13px Arial,
          sans-serif;
        text-transform: uppercase;
        letter-spacing: 1px;
        position: relative;
      }
      .site-header nav a:hover,
      .site-header nav a.active {
        color: #d7b96e;
      }
      .site-header nav a:after {
        content: "";
        position: absolute;
        left: 0;
        right: 100%;
        bottom: -9px;
        height: 1px;
        background: #d7b96e;
        transition: 0.25s;
      }
      .site-header nav a:hover:after,
      .site-header nav a.active:after {
        right: 0;
      }
      .head-actions {
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .icon,
      .menu,
      .close {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        font-size: 24px;
      }
      .cart {
        position: relative;
        font-size: 24px;
      }
      .cart-count {
        position: absolute;
        right: -9px;
        top: -7px;
        background: #d7b96e;
        color: #08261d;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        font: 700 10px/18px Arial;
        text-align: center;
      }
      .login,
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 22px;
        background: #c8a85d;
        color: #0c241c;
        border: 1px solid #c8a85d;
        font:
          700 12px Arial,
          sans-serif;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        cursor: pointer;
      }
      .login:hover,
      .btn:hover {
        background: #f1d98d;
        transform: translateY(-2px);
      }
      .btn.outline {
        background: transparent;
        color: inherit;
        border-color: currentColor;
      }
      .menu {
        display: none;
      }
      .mobile-panel,
      .overlay,
      .searchbar {
        display: none;
      }
      .searchbar.open {
        display: block;
        position: fixed;
        z-index: 49;
        top: 78px;
        left: 0;
        right: 0;
        padding: 20px;
        background: #0a2c22ef;
      }
      .searchbar form {
        max-width: 700px;
        margin: auto;
        display: flex;
      }
      .searchbar input {
        flex: 1;
        padding: 14px;
        border: 0;
      }
      .searchbar button {
        background: #c8a85d;
        border: 0;
        padding: 0 24px;
      }
      .hero,
      .page-hero {
        position: relative;
        color: #fff;
        background: center/cover no-repeat;
        isolation: isolate;
      }
      .hero:before,
      .page-hero:before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #061b15ed 0%, #061b15a8 50%, #061b1533);
        z-index: -1;
      }
      .hero {
        min-height: 92vh;
        display: flex;
        align-items: center;
        padding: 120px clamp(24px, 8vw, 130px) 70px;
        background-image: url("assets/library-hero (1).webp");
      }
      .hero-content {
        max-width: 720px;
      }
      .eyebrow {
        font:
          700 12px Arial,
          sans-serif;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #d9bb70;
      }
      .hero h1,
      .page-hero h1,
      .section-title,
      h1,
      h2 {
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: 0;
      }
      .hero h1 {
        font-size: clamp(48px, 7vw, 92px);
        margin: 18px 0;
      }
      .hero p {
        font-size: 20px;
        max-width: 610px;
        color: #eee6d8;
      }
      .hero-search {
        display: flex;
        max-width: 590px;
        margin: 30px 0 22px;
        background: #fff;
      }
      .hero-search input {
        flex: 1;
        min-width: 0;
        padding: 16px;
        border: 0;
      }
      .hero-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .page-hero {
        min-height: 52vh;
        padding: 160px clamp(24px, 8vw, 130px) 70px;
        display: flex;
        align-items: end;
        background-image: url("assets/editorial-books (1).webp");
      }
      .page-hero h1 {
        font-size: clamp(48px, 7vw, 82px);
        margin: 12px 0;
      }
      .page-hero p {
        max-width: 650px;
        font-size: 19px;
        color: #eee4d2;
      }
      .wrap {
        width: min(1180px, calc(100% - 40px));
        margin: auto;
      }
      .section {
        padding: 95px 0;
      }
      .section.dark {
        background: #0a2a21;
        color: #f7f0df;
      }
      .section.gold {
        background: #c6a45a;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 38px;
      }
      .section-title {
        font-size: clamp(36px, 5vw, 58px);
        margin: 8px 0;
      }
      .section-copy {
        max-width: 560px;
        color: #6b6a60;
      }
      .dark .section-copy {
        color: #ccc4b4;
      }
      .grid {
        display: grid;
        gap: 22px;
      }
      .grid-4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .grid-3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .feature {
        padding: 28px;
        border: 1px solid #c8bd9e;
        background: #f8f3e9;
        transition: 0.3s;
      }
      .feature:hover,
      .book:hover,
      .category:hover,
      .testimonial:hover,
      .stat:hover {
        transform: translateY(-7px);
        box-shadow: 0 20px 35px #17352a24;
        border-color: #b89549;
      }
      .feature .symbol {
        font-size: 28px;
        color: #9b7224;
      }
      .feature h3 {
        margin: 15px 0 5px;
        font-size: 20px;
      }
      .book {
        position: relative;
        background: #fffaf0;
        border: 1px solid #d7cdb7;
        padding: 14px;
        transition: 0.3s;
        overflow: hidden;
      }
      .book-cover {
        height: 300px;
        display: grid;
        place-items: center;
        padding: 28px;
        color: #f7efd9;
        text-align: center;
        background: linear-gradient(145deg, #113b2c, #061e17);
        transition: 0.4s;
      }
      .book:nth-child(2n) .book-cover {
        background: linear-gradient(145deg, #743d36, #291714);
      }
      .book:nth-child(3n) .book-cover {
        background: linear-gradient(145deg, #a17c35, #3b2c12);
      }
      .book-cover b {
        font-size: 27px;
        font-weight: 400;
        line-height: 1.1;
      }
      .book:hover .book-cover {
        transform: scale(1.025);
      }
      .book-info {
        padding: 16px 4px 5px;
      }
      .book-info small {
        color: #8a6a2d;
        text-transform: uppercase;
        font: 700 10px Arial;
        letter-spacing: 1px;
      }
      .book-info h3 {
        margin: 8px 0 2px;
        font-size: 21px;
      }
      .price {
        font: 700 17px Arial;
        color: #123d2d;
      }
      .old {
        text-decoration: line-through;
        color: #938d80;
        font-weight: 400;
        margin-left: 7px;
      }
      .stars {
        color: #a77a20;
      }
      .wish {
        position: absolute;
        top: 25px;
        right: 25px;
        border: 0;
        background: #f7f0df;
        width: 34px;
        height: 34px;
        cursor: pointer;
      }
      .add {
        width: 100%;
        border: 0;
        background: #123d2d;
        color: #fff;
        padding: 12px;
        margin-top: 13px;
        cursor: pointer;
      }
      .add:hover {
        background: #b69243;
        color: #08231a;
      }
      .promo {
        min-height: 500px;
        background: url("assets/editorial-books (1).webp") center/cover;
        display: flex;
        align-items: center;
        padding: 50px;
        position: relative;
        color: #fff;
      }
      .promo:before {
        content: "";
        position: absolute;
        inset: 0;
        background: #06251bbb;
      }
      .promo-card {
        position: relative;
        max-width: 610px;
        padding: 45px;
        border: 1px solid #ffffff4d;
        background: #09271c99;
        backdrop-filter: blur(9px);
      }
      .promo-card h2 {
        font-size: 55px;
        margin: 12px 0;
      }
      .category {
        min-height: 280px;
        padding: 26px;
        display: flex;
        flex-direction: column;
        justify-content: end;
        color: #fff;
        background: center/cover;
        position: relative;
        overflow: hidden;
        transition: 0.3s;
      }
      .category:before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent, #071d17e8);
      }
      .category > * {
        position: relative;
      }
      .category h3 {
        font-size: 29px;
        margin: 0;
      }
      .category:nth-child(3n + 1) {
        background-image: url("assets/categories-mosaic (1).webp");
      }
      .category:nth-child(3n + 2) {
        background-image: url("assets/reader (1).webp");
      }
      .category:nth-child(3n) {
        background-image: url("assets/library-hero (1).webp");
      }
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: stretch;
      }
      .split > img {
        width: 100%;
        height: 100%;
        min-height: 560px;
        object-fit: cover;
      }
      .split-content {
        padding: clamp(35px, 7vw, 90px);
        background: #e5dac5;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .split-content h2 {
        font-size: clamp(40px, 5vw, 65px);
        margin: 12px 0;
      }
      .testimonials {
        grid-template-columns: repeat(3, 1fr);
      }
      .testimonial {
        border-top: 2px solid #a78339;
        padding: 27px;
        background: #f9f4ea;
        transition: 0.3s;
      }
      .testimonial blockquote {
        margin: 15px 0;
        font-size: 18px;
      }
      .avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #153a2c;
        color: #fff;
        font: 700 15px Arial;
      }
      .newsletter {
        text-align: center;
        max-width: 780px;
        margin: auto;
      }
      .newsletter form {
        display: flex;
        margin-top: 28px;
      }
      .newsletter input {
        flex: 1;
        min-width: 0;
        padding: 16px;
        border: 1px solid #c8a85d;
        background: #fff;
      }
      .message {
        min-height: 24px;
        margin-top: 10px;
        color: #e1c779;
      }
      .final {
        min-height: 520px;
        text-align: center;
        display: grid;
        place-items: center;
        color: #fff;
        background:
          linear-gradient(#082018a6, #082018d9),
          url("assets/library-hero (1).webp") center/cover;
      }
      .final h2 {
        font-size: clamp(50px, 8vw, 95px);
        margin: 0;
      }
      .toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 12px;
        margin: 35px 0;
      }
      .toolbar input,
      .toolbar select,
      .form input,
      .form textarea {
        padding: 14px;
        border: 1px solid #bdb097;
        background: #fffdf7;
        width: 100%;
      }
      .shop-layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 35px;
      }
      .filters {
        border-right: 1px solid #cbbf9f;
        padding-right: 25px;
      }
      .filters h3 {
        margin: 25px 0 9px;
      }
      .filters label {
        display: block;
        padding: 6px 0;
        font-family: Arial, sans-serif;
        font-size: 14px;
      }
      .shop-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .shop-grid.list {
        grid-template-columns: 1fr;
      }
      .shop-grid.list .book {
        display: grid;
        grid-template-columns: 160px 1fr;
      }
      .shop-grid.list .book-cover {
        height: 220px;
      }
      .contact-grid {
        display: grid;
        grid-template-columns: 0.85fr 1.4fr;
        gap: 50px;
      }
      .contact-card {
        padding: 24px 0;
        border-bottom: 1px solid #c8bda3;
      }
      .form {
        display: grid;
        gap: 16px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .error {
        color: #9d2e28;
        font: 12px Arial;
        min-height: 16px;
      }
      .success {
        padding: 13px;
        background: #dbe9dc;
        color: #154829;
        display: none;
      }
      .faq-item {
        border-bottom: 1px solid #b9ac8f;
      }
      .faq-q {
        width: 100%;
        border: 0;
        background: none;
        padding: 20px 0;
        text-align: left;
        font-size: 19px;
        display: flex;
        justify-content: space-between;
        cursor: pointer;
      }
      .faq-a {
        max-height: 0;
        overflow: hidden;
        transition: 0.3s;
      }
      .faq-item.open .faq-a {
        max-height: 140px;
        padding-bottom: 20px;
      }
      .map {
        min-height: 380px;
        background:
          linear-gradient(#17382ccf, #17382ccf),
          url("assets/library-hero (1).webp") center/cover;
        color: #fff;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .stats {
        grid-template-columns: repeat(4, 1fr);
      }
      .stat {
        text-align: center;
        border: 1px solid #bda972;
        padding: 35px;
        transition: 0.3s;
      }
      .stat b {
        display: block;
        font-size: 45px;
        color: #957126;
      }
      footer {
        background: #061d16;
        color: #d9d2c2;
        padding: 70px clamp(24px, 6vw, 90px) 25px;
      }
      .footer-grid {
        display: grid;
        grid-template-columns: 1.4fr repeat(3, 1fr);
        gap: 50px;
      }
      .footer-logo {
        width: 150px;
        margin-bottom: 18px;
      }
      footer h3 {
        color: #d7b96e;
      }
      footer p {
        color: #aca99e;
      }
      footer a {
        display: block;
        margin: 8px 0;
        color: #c7c1b4;
      }
      footer a:hover {
        color: #e4c779;
        transform: translateX(3px);
      }
      .social {
        display: flex;
        gap: 10px;
      }
      .social a {
        width: 34px;
        height: 34px;
        border: 1px solid #8f805e;
        display: grid;
        place-items: center;
      }
      .footer-bottom {
        border-top: 1px solid #ffffff1f;
        margin-top: 50px;
        padding-top: 22px;
        display: flex;
        justify-content: space-between;
        font: 12px Arial;
        color: #8f918c;
      }
      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 80;
        background: #08271e;
        color: #fff;
        border-left: 4px solid #d7b96e;
        padding: 15px 20px;
        transform: translateY(130px);
        transition: 0.3s;
      }
      .toast.show {
        transform: none;
      }
      .reveal {
        opacity: 0;
        transform: translateY(25px);
        transition: 0.7s;
      }
      .reveal.visible {
        opacity: 1;
        transform: none;
      }
      @media (max-width: 900px) {
        .site-header {
          grid-template-columns: 1fr auto;
        }
        .site-header nav,
        .login {
          display: none;
        }
        .menu {
          display: block;
        }
        .mobile-panel {
          display: flex;
          position: fixed;
          z-index: 70;
          inset: 0 0 0 auto;
          width: min(86vw, 360px);
          padding: 80px 35px 35px;
          background: #08271e;
          color: #fff;
          flex-direction: column;
          gap: 20px;
          transform: translateX(105%);
          transition: 0.35s;
        }
        .mobile-panel.open {
          transform: none;
        }
        .mobile-panel img {
          width: 140px;
          margin-bottom: 12px;
        }
        .mobile-panel a {
          font-size: 22px;
          border-bottom: 1px solid #ffffff21;
          padding-bottom: 10px;
        }
        .close {
          position: absolute;
          right: 25px;
          top: 20px;
          font-size: 34px;
        }
        .overlay {
          position: fixed;
          z-index: 60;
          inset: 0;
          background: #0009;
        }
        .overlay.open {
          display: block;
        }
        .grid-4,
        .grid-3,
        .shop-grid,
        .testimonials {
          grid-template-columns: repeat(2, 1fr);
        }
        .split,
        .contact-grid {
          grid-template-columns: 1fr;
        }
        .shop-layout {
          grid-template-columns: 1fr;
        }
        .filters {
          border: 0;
          border-bottom: 1px solid #cbbf9f;
          padding: 0 0 25px;
        }
        .footer-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .site-header {
          padding: 10px 18px;
          min-height: 66px;
        }
        .brand img {
          width: 112px;
        }
        .searchbar.open {
          top: 66px;
        }
        .hero {
          min-height: 90vh;
          padding: 105px 22px 45px;
        }
        .hero h1 {
          font-size: 47px;
        }
        .hero p {
          font-size: 17px;
        }
        .page-hero {
          padding: 125px 22px 45px;
        }
        .section {
          padding: 65px 0;
        }
        .wrap {
          width: min(100% - 28px, 1180px);
        }
        .grid-4,
        .grid-3,
        .shop-grid,
        .testimonials,
        .stats {
          grid-template-columns: 1fr;
        }
        .section-head {
          align-items: start;
          flex-direction: column;
        }
        .book-cover {
          height: 360px;
        }
        .promo {
          padding: 18px;
        }
        .promo-card {
          padding: 28px;
        }
        .promo-card h2 {
          font-size: 40px;
        }
        .split > img {
          min-height: 440px;
        }
        .split-content {
          padding: 40px 24px;
        }
        .newsletter form,
        .toolbar {
          grid-template-columns: 1fr;
          display: grid;
        }
        .form-row {
          grid-template-columns: 1fr;
        }
        .footer-grid {
          grid-template-columns: 1fr;
        }
        .footer-bottom {
          flex-direction: column;
          gap: 12px;
        }
        .shop-grid.list .book {
          grid-template-columns: 1fr;
        }
        .toolbar {
          gap: 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
        .reveal {
          opacity: 1;
          transform: none;
        }
      }
      body {
        background: #0a261d;
        color: #efe7d6;
      }
      .auth {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .auth-visual {
        position: fixed;
        inset: 0 50% 0 0;
        background:
          linear-gradient(#061b1550, #061b15dc),
          url("assets/library-hero (1).webp") center/cover;
        padding: 45px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .auth-visual img {
        width: 150px;
      }
      .auth-visual h1 {
        font-size: clamp(46px, 5vw, 78px);
        max-width: 600px;
      }
      .go-home {
        position: absolute;
        right: 30px;
        top: 30px;
        color: #fff;
      }
      .auth-panel {
        grid-column: 2;
        min-height: 100vh;
        background: #f4efe3;
        color: #1e2923;
        padding: 50px clamp(25px, 7vw, 100px);
        overflow-y: auto;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-bottom: 35px;
        border-bottom: 1px solid #baa987;
      }
      .tab {
        border: 0;
        background: none;
        padding: 16px;
        font: 700 13px Arial;
        cursor: pointer;
      }
      .tab.active {
        color: #89691f;
        border-bottom: 2px solid #89691f;
      }
      .auth-form {
        display: none;
        gap: 16px;
      }
      .auth-form.active {
        display: grid;
      }
      .roles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .role {
        border: 1px solid #bfb398;
        background: #fcf8ef;
        padding: 18px;
        text-align: left;
        cursor: pointer;
      }
      .role.active {
        border-color: #89691f;
        box-shadow: inset 0 0 0 1px #89691f;
        background: #eee3c9;
      }
      .role b {
        display: block;
      }
      .auth-panel label {
        font: 600 13px Arial;
      }
      .auth-panel input:not([type="checkbox"]) {
        display: block;
        width: 100%;
        padding: 14px;
        margin-top: 6px;
        border: 1px solid #bfb398;
        background: #fffdf8;
      }
      .check {
        display: flex;
        gap: 8px;
      }
      .social-login {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .social-login button {
        padding: 12px;
        border: 1px solid #bfb398;
        background: #fff;
      }
      .auth-note {
        text-align: center;
        color: #756e61;
      }
      .auth-msg {
        min-height: 22px;
        color: #9d2e28;
      }
      @media (max-width: 750px) {
        .auth {
          display: block;
        }
        .auth-visual {
          position: relative;
          inset: auto;
          min-height: 42vh;
          padding: 28px;
        }
        .auth-visual h1 {
          font-size: 42px;
          margin-top: 100px;
        }
        .auth-panel {
          min-height: auto;
          padding: 40px 22px;
        }
        .go-home {
          right: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="auth">
      <section class="auth-visual">
        <img src="./assets/stackly-logo-white (1).webp" alt="Stackly" /><a class="go-home" href="index.html">← Go Home</a>
        <div>
          <span class="eyebrow">Your personal library</span>
          <h1>Your Next Favorite Book Awaits.</h1>
          <p>Sign in to discover new stories, track your orders and build your personal reading collection.</p>
        </div>
      </section>
      <section class="auth-panel">
        <div class="tabs">
          <button class="tab active" data-tab="login">LOGIN</button
          ><button class="tab" data-tab="signup">SIGN UP</button>
        </div>
        <form class="auth-form active" id="login">
          <h2>Welcome back</h2>
          <p>Choose your role and continue your reading journey.</p>
          <div class="roles">
            <button type="button" class="role active" data-role="admin">
              ♜ <b>Admin</b><small>Manage the bookstore</small></button
            ><button type="button" class="role" data-role="customer">
              ♙ <b>Customer</b><small>Discover and purchase books</small>
            </button>
          </div>
          <label>Email<input name="email" type="email" autocomplete="email" /></label
          ><label>Password<input name="password" type="password" autocomplete="current-password" /></label
          ><label class="check"><input type="checkbox" /> Remember me</label><a href="404.html">Forgot Password?</a>
          <div class="auth-msg"></div>
          <button class="btn">Login</button>
          <p class="auth-note">Or continue with</p>
          <div class="social-login"><button onclick="window.location.href='404.html'" type="button">G Google</button><button onclick="window.location.href='404.html'" type="button">● Apple</button></div>
        </form>
        <form class="auth-form" id="signup">
          <h2>Create your account</h2>
          <div class="roles">
            <button type="button" class="role active" data-role="admin">
              ♜ <b>Admin</b><small>Manage the bookstore</small></button
            ><button type="button" class="role" data-role="customer">
              ♙ <b>Customer</b><small>Discover and purchase books</small>
            </button>
          </div>
          <label>Full Name<input name="name" autocomplete="name" /></label
          ><label>Email<input name="email" type="email" autocomplete="email" /></label
          ><label>Password<input name="password" type="password" autocomplete="new-password" /></label
          ><label>Confirm Password<input name="confirm" type="password" autocomplete="new-password" /></label
          ><label class="check"><input name="terms" type="checkbox" /> I accept the Terms & Conditions</label>
          <div class="auth-msg"></div>
          <button class="btn">Create Account</button>
        </form>
      </section>
    </main>
    <div class="toast" role="status"></div>
    <script>
      const $ = (s, c = document) => c.querySelector(s),
        $$ = (s, c = document) => [...c.querySelectorAll(s)];
      const panel = $(".mobile-panel"),
        overlay = $(".overlay");
      function closeMenu() {
        panel?.classList.remove("open");
        overlay?.classList.remove("open");
        document.body.classList.remove("menu-open");
        panel?.setAttribute("aria-hidden", "true");
      }
      $(".menu")?.addEventListener("click", () => {
        panel.classList.add("open");
        overlay.classList.add("open");
        document.body.classList.add("menu-open");
        panel.setAttribute("aria-hidden", "false");
      });
      $(".close")?.addEventListener("click", closeMenu);
      overlay?.addEventListener("click", closeMenu);
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });
      addEventListener("scroll", () => $("#header")?.classList.toggle("scrolled", scrollY > 30));
      $(".search-toggle")?.addEventListener("click", () => $(".searchbar")?.classList.toggle("open"));
      const file = location.pathname.split("/").pop() || "index.html";
      $$(".site-header nav a").forEach((a) => a.classList.toggle("active", a.getAttribute("href") === file));
      function getCart() {
        try {
          return JSON.parse(localStorage.getItem("cartItems") || "[]");
        } catch {
          return [];
        }
      }
      function updateCart() {
        $$(".cart-count").forEach((x) => (x.textContent = getCart().reduce((n, x) => n + x.qty, 0)));
      }
      updateCart();
      function toast(t) {
        const el = $(".toast");
        if (!el) return;
        el.textContent = t;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 2400);
      }
      $$(".add").forEach((b) =>
        b.addEventListener("click", () => {
          const card = b.closest(".book"),
            title = b.dataset.book || card?.querySelector("h3")?.textContent || "Book",
            author = card?.querySelector(".book-info>p")?.textContent || "",
            price = Number(card?.dataset.price || b.dataset.price || 399);
          const cart = getCart(),
            found = cart.find((x) => x.title === title);
          if (found) found.qty += 1;
          else cart.push({ title, author, price, qty: 1 });
          localStorage.setItem("cartItems", JSON.stringify(cart));
          updateCart();
          toast(title + " added to your cart.");
        }),
      );
      const io = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting) e.target.classList.add("visible");
          }),
        { threshold: 0.1 },
      );
      $$(".reveal").forEach((x) => io.observe(x));
      $$(".tab").forEach((t) =>
        t.addEventListener("click", () => {
          $$(".tab").forEach((x) => x.classList.toggle("active", x === t));
          $$(".auth-form").forEach((x) => x.classList.toggle("active", x.id === t.dataset.tab));
        }),
      );
      $$(".roles").forEach((group) =>
        $$(".role", group).forEach((r) =>
          r.addEventListener("click", () => {
            $$(".role", group).forEach((x) => x.classList.remove("active"));
            r.classList.add("active");
          }),
        ),
      );
      const emailOK = (v) => /^[^\s@]+@[^\s@]+\.(com|in|org)$/i.test(v);
      $("#login").addEventListener("submit", (e) => {
        e.preventDefault();
        const f = e.target,
          email = f.email.value.trim(),
          pass = f.password.value,
          role = $(".role.active", f).dataset.role,
          msg = $(".auth-msg", f);
        if (!emailOK(email)) {
          msg.textContent = "Enter a valid .com, .in or .org email.";
          return;
        }
        if (pass.length < 6) {
          msg.textContent = "Password must contain at least 6 characters.";
          return;
        }
        const raw = email.split("@")[0].replace(/[._-]+/g, " ");
        const name = raw.replace(/\b\w/g, (c) => c.toUpperCase());
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("userRole", role);
        localStorage.setItem("userEmail", email);
        localStorage.setItem("userName", name);
        location.href = role === "admin" ? "admin-dashboard.html" : "customer-dashboard.html";
      });
      $("#signup").addEventListener("submit", (e) => {
        e.preventDefault();
        const f = e.target,
          msg = $(".auth-msg", f),
          name = f.name.value.trim();
        if (!/^[A-Za-z ]{2,}$/.test(name)) {
          msg.textContent = "Name may contain letters and spaces only.";
          return;
        }
        if (!emailOK(f.email.value.trim())) {
          msg.textContent = "Enter a valid .com, .in or .org email.";
          return;
        }
        if (f.password.value.length < 6) {
          msg.textContent = "Password must contain at least 6 characters.";
          return;
        }
        if (f.password.value !== f.confirm.value) {
          msg.textContent = "Passwords do not match.";
          return;
        }
        if (!f.terms.checked) {
          msg.textContent = "Please accept the Terms & Conditions.";
          return;
        }
        localStorage.setItem("registeredName", name);
        $$(".tab")[0].click();
        $(".auth-msg", $("#login")).textContent = "Account created. Sign in to continue.";
      });
    </script>
  </body>
</html>
